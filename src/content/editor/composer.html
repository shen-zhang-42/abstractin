<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Message editor</title>
<style>
html, body { margin: 0; padding: 0; background: transparent; color: var(--editor-text, CanvasText); font: 13px system-ui, sans-serif; }
.composer-math { display: inline-block; max-width: 100%; vertical-align: middle; cursor: text; }
.composer-math[data-display="true"] { display: block; margin: 6px 0; overflow-x: auto; text-align: center; }
.composer-math math { font-size: 1.1em; }
</style>
<script defer src="composer.bundle.js"></script>
</head>
<body><div id="editor"></div></body>
</html>
