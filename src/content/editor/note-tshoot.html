<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Note editor</title>
<link rel="stylesheet" href="note.bundle.css">
<style>
html,body,#editor { height:100%; margin:0; overflow:hidden; }
:root { --vscode-editor-background:transparent; --vscode-editor-foreground:var(--editor-text,CanvasText); --vscode-foreground:var(--editor-text,CanvasText); --vscode-descriptionForeground:var(--editor-faint,GrayText); --vscode-focusBorder:var(--editor-faint,#888); --vscode-editorWidget-background:Canvas; --vscode-input-background:Canvas; --vscode-input-foreground:CanvasText; --vscode-panel-border:var(--editor-faint,#aaa); }
body { background:transparent; color:var(--editor-text,CanvasText); font:13px/1.8 system-ui,sans-serif; }
#editor { display:flex; flex-direction:column; }
#editor>.cm-editor { flex:1; min-height:0; font:inherit; }
.cm-editor .cm-scroller { font-family:inherit; }
.cm-editor .cm-content.cm-content { font-family:inherit; font-size:inherit; padding:12px 16px 80px; }
.note-format-toolbar { display:flex; align-items:center; gap:4px; padding:4px 2px; border-bottom:1px solid var(--editor-hover,#8882); flex-wrap:wrap; }
.note-format-toolbar button { font:inherit; color:inherit; background:transparent; border:0; border-radius:4px; padding:3px 8px; cursor:pointer; }
.note-format-toolbar button:hover { background:var(--editor-hover,#8882); }
.note-format-toolbar button[data-action=bold], .cm-line strong { font-weight:700; }
.note-format-toolbar button[data-action=italic] { font-style:italic; }
.cm-line.mlp-line-h1 { font-size:2em; font-weight:650; }
.cm-line.mlp-line-h2 { font-size:1.6em; font-weight:650; }
.cm-line.mlp-line-h3 { font-size:1.3em; font-weight:600; }
.cm-line.mlp-line-h4,.cm-line.mlp-line-h5,.cm-line.mlp-line-h6 { font-weight:600; }
.cm-line.mlp-line-quote { border-left:3px solid var(--editor-faint,#999); padding-left:14px !important; color:var(--editor-faint,GrayText); }
.cm-content table { border-collapse:collapse; width:100%; }
.cm-content :is(th,td) { border:1px solid var(--editor-faint,#aaa); padding:6px 10px; }
.cm-content th { background:var(--editor-hover,#8881); }
.note-diagram { padding:12px 0; overflow:auto; background:white; color:#252525; }
.note-diagram-tools { display:flex; justify-content:space-between; align-items:center; gap:12px; font:12px/1.5 system-ui,sans-serif; color:#666; margin-bottom:8px; }
.note-diagram-tools button { background:#f5f5f5; border:1px solid #ccc; border-radius:5px; padding:4px 8px; cursor:pointer; }
.note-diagram-preview { text-align:center; min-height:48px; }
.note-diagram-preview svg { max-width:100%; height:auto; }
</style><script defer src="note.bundle.js"></script></head><body><div id="editor"></div></body></html>
