<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回答模式设计</title>
<style>body{font:15px/1.6 system-ui,sans-serif;background:#eee;color:#292929;margin:28px}main{max-width:650px;margin:auto}.menu{background:#fafafa;border:1px solid #d2d2d2;border-radius:10px;padding:8px;max-width:280px}.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:6px}.row.active{background:#e4e9ee}.row img,.row svg{width:22px;height:22px;flex:none}.name{font-weight:600}.hint{color:#666;font-size:13px}.check{margin-left:auto}h1{font-size:22px}</style>
<main><h1>三个回答模式</h1><div class="menu">
<div class="row" title="只解释提供的内容，不查询 PDF。"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H8l-5 3V11a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/><path d="M8 9h8M8 13h5"/></svg><span class="name">Context only</span></div>
<div class="row active" title="能够可靠回答时直接回答，需要原文证据时查询 PDF。"><img src="../../src/content/icons/reading-balanced.svg" alt="天平"><span class="name">Balanced</span><span class="check">✓</span></div>
<div class="row" title="回答以原文为依据，不用外部知识补充书中没有的内容。"><img src="../../src/content/icons/lucide-file-search.svg" alt="原文查找"><span class="name">Source only</span></div>
</div><p class="hint">设计预览：悬停查看说明。Balanced 建议作为默认模式。</p></main></html>
