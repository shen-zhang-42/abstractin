<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>狨猴动画预览</title>
<style>body{font:16px/1.6 system-ui,sans-serif;margin:24px;background:#eee;color:#292929}main{max-width:640px;margin:auto}img{display:block;width:100%;max-width:420px;margin:auto}button{font:inherit;margin:12px 8px 0 0;padding:6px 16px}</style>
<main><h1>从视频生成的狨猴动画</h1><img id="companion" src="../../src/content/companions/marmoset-idle.png" alt="狨猴"><button id="play">播放</button><button id="stop">静止</button></main>
<script>
const companion=document.getElementById('companion');let count=0;
function play(){companion.src='../../src/content/companions/marmoset-motion.webp?play='+ ++count;}
function stop(){companion.src='../../src/content/companions/marmoset-idle.png';}
document.getElementById('play').addEventListener('click',play);document.getElementById('stop').addEventListener('click',stop);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)play();
</script></html>
